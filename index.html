<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A1428">
<meta name="description" content="Bolao de palpites da NFL 2026 - Uscara">
<title>Simulador NFL 26 · Uscara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --field:#0A1428;
  --field2:#111E3A;
  --field3:#1A2C4E;
  --bone:#EEF1F7;
  --bone2:#D8DDE8;
  --ink:#0F1829;
  --flag:#E4572E;
  --gold:#E8B33A;
  --slate:#7D8CA8;
  --line:rgba(238,241,247,.14);
  --ok:#4FB477;
  --no:#C4483A;
  --r:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--field);
  color:var(--bone);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  padding-bottom:80px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(90deg,transparent 0 78px,rgba(238,241,247,.025) 78px 79px),
    radial-gradient(ellipse 120% 60% at 50% -10%,rgba(232,179,58,.08),transparent 65%);
}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header{padding:26px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brandrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:clamp(34px,7vw,56px);line-height:.92;letter-spacing:-.5px;
  text-transform:uppercase;
}
h1 em{font-style:normal;color:var(--gold)}
.season{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;
  color:var(--slate);letter-spacing:2px;
}
.tagline{color:var(--slate);font-size:13px;margin-top:6px}
.stamp{
  font-size:11px;font-weight:600;letter-spacing:.4px;
  color:var(--gold);background:rgba(232,179,58,.1);
  border:1px solid rgba(232,179,58,.3);padding:2px 8px;border-radius:3px;
}

/* ---------- nav ---------- */
nav{display:flex;gap:2px;margin:20px 0 0;flex-wrap:wrap}
.tab{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;
  letter-spacing:.6px;background:none;border:none;color:var(--slate);
  padding:9px 15px;cursor:pointer;border-bottom:2px solid transparent;
  transition:color .12s,border-color .12s;
}
.tab:hover{color:var(--bone)}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--flag)}
.tab:disabled{opacity:.38;cursor:not-allowed}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}

/* ---------- panels ---------- */
.panel{display:none;animation:fade .18s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.card{
  background:var(--field2);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;margin-bottom:14px;
}
.card.paper{background:var(--bone);color:var(--ink);border-color:var(--bone2)}
h2{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;
}
h3{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;
}
.sub{color:var(--slate);font-size:13px;margin-bottom:16px}
.card.paper .sub{color:#5A6580}

/* ---------- controls ---------- */
button,select,input,textarea{font-family:inherit;font-size:14px}
.btn{
  background:var(--flag);color:#fff;border:none;border-radius:4px;
  padding:9px 16px;font-weight:600;cursor:pointer;transition:filter .12s;
}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bone)}
.card.paper .btn.ghost{border-color:#BFC7D6;color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
select,input[type=text]{
  background:var(--field);color:var(--bone);border:1px solid var(--line);
  border-radius:4px;padding:8px 10px;
}
.card.paper select,.card.paper input[type=text]{background:#fff;color:var(--ink);border-color:#BFC7D6}
textarea{
  width:100%;min-height:170px;background:#fff;color:var(--ink);
  border:1px solid #BFC7D6;border-radius:4px;padding:11px;
  line-height:1.6;resize:vertical;
}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
label{font-size:13px;color:var(--slate);font-weight:500}
.card.paper label{color:#5A6580}

/* ---------- ranking ---------- */
.standings{display:flex;flex-direction:column;gap:5px}
.stand{
  display:grid;grid-template-columns:34px 1fr auto auto;
  align-items:center;gap:12px;padding:11px 14px;
  background:var(--field2);border:1px solid var(--line);border-radius:var(--r);
  border-left:3px solid var(--slate);
}
.stand.p1{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(232,179,58,.1),var(--field2) 42%)}
.stand.p2{border-left-color:#B7C2D6}
.stand.p3{border-left-color:#A9784B}
.pos{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;color:var(--slate)}
.stand.p1 .pos{color:var(--gold)}
.who{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:21px;letter-spacing:.5px}
.pct{color:var(--slate);font-size:13px;min-width:52px;text-align:right}
.crown{
  background:var(--gold);color:var(--ink);font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:3px;letter-spacing:.4px;
}
.weekbadge{
  background:rgba(228,87,46,.18);color:#F08D6B;border:1px solid rgba(228,87,46,.35);
  font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;
}

/* ---------- games ---------- */
.games{display:flex;flex-direction:column;gap:6px}
.game{
  background:var(--field2);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 14px;
}
.game{position:relative}
.game.intl{border-color:rgba(232,179,58,.3)}
.flag{
  position:absolute;top:8px;right:10px;font-size:11px;
  color:var(--gold);letter-spacing:.3px;display:flex;align-items:center;gap:4px;
  background:rgba(232,179,58,.1);border:1px solid rgba(232,179,58,.28);
  padding:1px 7px;border-radius:3px;
}
.gmatch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tm{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;
  padding:2px 8px;border-radius:3px;border:1px solid transparent;cursor:pointer;
  background:none;color:var(--bone);transition:background .12s;
}
.tm:hover{background:rgba(238,241,247,.08)}
.tm.win{background:var(--ok)!important;color:#07140D!important;border-color:var(--ok)}
.at{color:var(--slate);font-size:12px}
.picks{display:flex;gap:5px;flex-wrap:wrap}
.pick{
  font-size:11px;padding:3px 7px;border-radius:3px;
  background:rgba(238,241,247,.07);border:1px solid var(--line);
}
.pick.hit{background:rgba(79,180,119,.16);border-color:rgba(79,180,119,.4);color:#8FD9AE}
.pick.miss{background:rgba(196,72,58,.14);border-color:rgba(196,72,58,.35);color:#E29188}
.pick b{font-weight:600}
.pick i{font-style:normal;opacity:.62}

/* ---------- stats ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.stat{background:var(--field2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat h4{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;
}
.stat .why{color:var(--slate);font-size:12px;margin-bottom:11px;line-height:1.4}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:9px;font-size:13px}
.bar .track{height:7px;background:rgba(238,241,247,.09);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--flag);border-radius:4px}
.bar .fill.g{background:var(--gold)}
.bar .fill.ok{background:var(--ok)}
.bar .v{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;min-width:46px;text-align:right}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-weight:600;text-align:right}
table.h2h{width:100%;border-collapse:collapse;font-size:12px}
table.h2h th,table.h2h td{padding:5px 4px;text-align:center;border:1px solid var(--line)}
table.h2h th{color:var(--slate);font-weight:500;font-size:11px}
table.h2h td.self{background:rgba(238,241,247,.05);color:var(--slate)}
table.h2h td.w{color:#8FD9AE;font-weight:600}
table.h2h td.l{color:#E29188}

/* ---------- review ---------- */
.rev{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.revrow{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:8px 10px;background:#fff;border:1px solid #D3DAE6;border-radius:4px;
}
.revrow.bad{border-color:var(--flag);background:#FBEFEA}
.revrow .m{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px}
.revrow select{min-width:150px}
.warn{background:#FBEFEA;border:1px solid var(--flag);color:#8A2E14;padding:10px 12px;border-radius:4px;font-size:13px;margin-bottom:12px}
.note{background:rgba(232,179,58,.1);border:1px solid rgba(232,179,58,.3);color:var(--gold);padding:10px 12px;border-radius:4px;font-size:13px;margin-bottom:12px}
.empty{color:var(--slate);text-align:center;padding:38px 16px;font-size:14px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--flag);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lock{text-align:center;padding:52px 20px}
.lock p{color:var(--slate);max-width:420px;margin:8px auto 18px}
@media(max-width:560px){
  .stand{grid-template-columns:28px 1fr auto;gap:9px}
  .pct{display:none}
  .bar{grid-template-columns:62px 1fr auto}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brandrow">
    <h1>Simulador <em>NFL</em></h1>
    <span class="season">2026 · Uscara</span>
    <span class="stamp" id="stamp"></span>
  </div>
  <p class="tagline">Palpites da rodada, ranking e as estatísticas que rendem discussão.</p>
  <nav role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-p="rank">Ranking</button>
    <button class="tab" role="tab" aria-selected="false" data-p="week">Rodada</button>
    <button class="tab" role="tab" aria-selected="false" data-p="stats">Estatísticas</button>
    <button class="tab" role="tab" aria-selected="false" data-p="po" id="tabPO" disabled>Playoffs</button>
    <button class="tab" role="tab" aria-selected="false" data-p="admin">Administrar</button>
  </nav>
</header>

<section class="panel on" id="p-rank"></section>
<section class="panel" id="p-week"></section>
<section class="panel" id="p-stats"></section>
<section class="panel" id="p-po"></section>
<section class="panel" id="p-admin"></section>

</div>

<script>

/* mapeia sigla da ESPN -> nossa sigla */
const ESPN_FIX = {ARI:'ARI',WSH:'WAS',LA:'LAR',OAK:'LV',SD:'LAC',JAC:'JAX'};

const norm = s => (s||'').toString().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]/g,'');

function resolveTeam(raw){
  const k = norm(raw);
  if(!k) return null;
  if(ALIAS[k]) return ALIAS[k];
  if(TEAMS[k.toUpperCase()]) return k.toUpperCase();
  // tenta achar por sufixo/prefixo (ex.: "tampabaybuccaneers")
  for(const a in ALIAS){ if(k.endsWith(a) && a.length>3) return ALIAS[a]; }
  return null;
}

const $ = s => document.querySelector(s);
const T = ab => TEAMS[ab] ? TEAMS[ab].n : ab;
const TC = ab => TEAMS[ab] ? TEAMS[ab].col : 'var(--bone)';
const TN = ab => `<span style="color:${TC(ab)}">${T(ab)}</span>`;
const gid = (a,h) => a+'@'+h;

function weekList(){
  const ks = Object.keys(DB.weeks).map(Number).sort((a,b)=>a-b);
  return ks;
}
function getWeek(w){ return DB.weeks[w]; }
function ensureWeek(w){
  if(!DB.weeks[w]) DB.weeks[w] = {games:[],picks:{}};
  return DB.weeks[w];
}

/* ============================================================
   BUSCA AUTOMÁTICA (ESPN) COM PLANO B
   ============================================================ */
async function fetchWeek(w){
  const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=400&dates=${DB.season}&seasontype=2&week=${w}`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  if(!j.events || !j.events.length) throw new Error('sem jogos');
  const games = j.events.map(ev=>{
    const cmp = ev.competitions[0];
    const cs = cmp.competitors;
    const home = cs.find(c=>c.homeAway==='home');
    const away = cs.find(c=>c.homeAway==='away');
    const ab = c => { const a=(c.team.abbreviation||'').toUpperCase(); return ESPN_FIX[a]||a; };
    const H=ab(home), A=ab(away);
    let winner=null;
    if(cmp.status && cmp.status.type && cmp.status.type.completed){
      if(home.winner) winner=H;
      else if(away.winner) winner=A;
      else winner='EMPATE';
    }
    return {id:gid(A,H),away:A,home:H,winner};
  }).filter(g=>TEAMS[g.away]&&TEAMS[g.home]);
  if(!games.length) throw new Error('nenhum jogo reconhecido');
  return games;
}

async function loadWeek(w,{keepResults=true}={}){
  const box = $('#loadMsg');
  if(box) box.innerHTML = '<span class="spin"></span> Buscando a Semana '+w+'…';
  try{
    const games = await fetchWeek(w);
    mergeGames(w,games,keepResults);
    if(box) box.textContent = 'Semana '+w+' carregada: '+games.length+' jogos.';
    render();
    return true;
  }catch(err){
    let msg = 'Busca automática indisponível aqui (o navegador bloqueia a conexão externa). ';
    if(FALLBACK[w]){
      mergeGames(w,fromFallback(w),keepResults);
      msg += 'Usei o calendário guardado no arquivo para a Semana '+w+'. Os resultados você marca na aba Rodada.';
      render();
    }else{
      msg += 'Cole os confrontos da Semana '+w+' no campo abaixo.';
      render();
      const mb=document.querySelector('#manualBox');
      if(mb) mb.style.display='block';
    }
    const b2=document.querySelector('#loadMsg');
    if(b2) b2.textContent = msg;
    return false;
  }
}

function fromFallback(w){
  return (FALLBACK[w]||[]).map(([a,h,fl,city])=>({id:gid(a,h),away:a,home:h,winner:null,flag:fl||null,city:city||null}));
}
function mergeGames(w,games,keepResults){
  const wk = ensureWeek(w);
  const old = {};
  wk.games.forEach(g=>old[g.id]=g);
  wk.games = games.map(g=>{
    const prev = old[g.id];
    let winner = g.winner;
    if(keepResults && prev && prev.winner && !g.winner) winner = prev.winner;
    const fb=(FALLBACK[w]||[]).find(x=>x[0]===g.away&&x[1]===g.home);
    return {id:g.id,away:g.away,home:g.home,winner:winner||null,
            flag:g.flag||(fb?fb[2]:null)||null, city:g.city||(fb?fb[3]:null)||null};
  });
}

/* cola manual de confrontos: "Bears x Panthers" (visitante x mandante) */
function parseSchedule(text){
  const out=[],bad=[];
  text.split(/\n+/).forEach(line=>{
    const raw=line.trim(); if(!raw) return;
    const m = raw.split(/\s+(?:x|X|vs\.?|@|em)\s+/);
    if(m.length<2){ bad.push(raw); return; }
    const a=resolveTeam(m[0]), h=resolveTeam(m[1].replace(/[:*].*$/,''));
    if(!a||!h){ bad.push(raw); return; }
    out.push({id:gid(a,h),away:a,home:h,winner:null});
  });
  return {games:out,bad};
}

/* ============================================================
   LEITOR DOS PALPITES DO WHATSAPP
   ============================================================ */
function parsePicks(text,games){
  const rows=[],unmatched=[];
  const used=new Set();
  text.split(/\n+/).forEach(line=>{
    const raw=line.trim(); if(!raw) return;
    const parts = raw.split(':');
    if(parts.length<2){ unmatched.push(raw); return; }
    const choiceRaw = parts.slice(1).join(':').replace(/[*_~`]/g,'').trim();
    const pick = resolveTeam(choiceRaw);
    const left = parts[0].replace(/[*_~`]/g,'');
    const sides = left.split(/\s+(?:x|X|vs\.?|@)\s+/);
    const a = sides[0]?resolveTeam(sides[0]):null;
    const b = sides[1]?resolveTeam(sides[1]):null;
    if(!pick||!a||!b){ unmatched.push(raw); return; }
    const g = games.find(g=>(g.away===a&&g.home===b)||(g.away===b&&g.home===a));
    if(!g){ unmatched.push(raw); return; }
    if(used.has(g.id)) return;
    used.add(g.id);
    const valid = (pick===g.away||pick===g.home);
    rows.push({gameId:g.id,pick:valid?pick:null,line:raw});
  });
  return {rows,unmatched};
}

/* ============================================================
   CÁLCULOS
   ============================================================ */
function weekScore(w,player){
  const wk=getWeek(w); if(!wk) return {hit:0,played:0};
  let hit=0,played=0;
  wk.games.forEach(g=>{
    if(!g.winner||g.winner==='EMPATE') return;
    played++;
    const p=(wk.picks[player]||{})[g.id];
    if(p&&p===g.winner) hit++;
  });
  return {hit,played};
}
function totals(){
  const t={};
  DB.players.forEach(p=>t[p]={hit:0,played:0});
  weekList().forEach(w=>DB.players.forEach(p=>{
    const s=weekScore(w,p); t[p].hit+=s.hit; t[p].played+=s.played;
  }));
  return t;
}
function ranked(){
  const t=totals();
  return DB.players.slice().sort((a,b)=> t[b].hit-t[a].hit || a.localeCompare(b))
    .map(p=>({p,...t[p]}));
}
function decided(w){ const wk=getWeek(w); return wk?wk.games.filter(g=>g.winner&&g.winner!=='EMPATE'):[]; }

/* voto da maioria do grupo em um jogo */
function consensus(wk,g){
  const c={};
  DB.players.forEach(p=>{ const v=(wk.picks[p]||{})[g.id]; if(v) c[v]=(c[v]||0)+1; });
  const ks=Object.keys(c); if(!ks.length) return null;
  ks.sort((a,b)=>c[b]-c[a]);
  if(ks.length>1 && c[ks[0]]===c[ks[1]]) return {team:null,split:c};
  return {team:ks[0],split:c};
}

/* ============================================================
   RENDER — RANKING
   ============================================================ */
function renderRank(){
  const el=$('#p-rank');
  const ws=weekList();
  if(!ws.length){
    el.innerHTML=`<div class="card"><div class="empty">Nenhuma rodada carregada ainda.<br>
      Vá em <b>Administrar</b> e carregue a Semana 1 para começar.</div></div>`;
    return;
  }
  const t=totals();
  const lastPlayed=[...ws].reverse().find(w=>decided(w).length>0);
  const wkScores={};
  if(lastPlayed) DB.players.forEach(p=>wkScores[p]=weekScore(lastPlayed,p));
  const best=lastPlayed?Math.max(...DB.players.map(p=>wkScores[p].hit)):-1;
  const list=ranked();
  const maxHit=list[0]?list[0].hit:0;

  let h=`<div class="card"><h2>Classificação geral</h2>
    <p class="sub">${list[0]?list[0].played:0} jogos decididos${lastPlayed?` · destaque da Semana ${lastPlayed}`:''}</p>
    <div class="standings">`;
  list.forEach((r,i)=>{
    const pct=r.played?Math.round(r.hit/r.played*100):0;
    const kingWeek = lastPlayed && wkScores[r.p].hit===best && best>0;
    h+=`<div class="stand ${i<3?'p'+(i+1):''}">
      <div class="pos">${i+1}</div>
      <div class="who">${r.p}
        ${i===0&&maxHit>0?'<span class="crown">Líder</span>':''}
        ${kingWeek?`<span class="weekbadge">Rei da Semana ${lastPlayed} · ${wkScores[r.p].hit}</span>`:''}
      </div>
      <div class="rec">${r.hit}-${r.played-r.hit}</div>
      <div class="pct">${pct}%</div>
    </div>`;
  });
  h+='</div></div>';

  /* pontuação semana a semana */
  h+=`<div class="card"><h3>Semana a semana</h3>
    <div style="overflow-x:auto"><table class="h2h"><tr><th>Semana</th>`;
  DB.players.forEach(p=>h+=`<th>${p}</th>`);
  h+='</tr>';
  ws.forEach(w=>{
    const d=decided(w).length;
    h+=`<tr><td class="self">${w}</td>`;
    DB.players.forEach(p=>{
      const s=weekScore(w,p);
      h+=`<td>${d?`${s.hit}/${d}`:'—'}</td>`;
    });
    h+='</tr>';
  });
  h+=`<tr><td class="self"><b>Total</b></td>`;
  DB.players.forEach(p=>h+=`<td class="w">${t[p].hit}</td>`);
  h+='</tr></table></div></div>';
  el.innerHTML=h;
}

/* ============================================================
   RENDER — RODADA
   ============================================================ */
function renderWeek(){
  const el=$('#p-week');
  const ws=weekList();
  if(!ws.length){ el.innerHTML=`<div class="card"><div class="empty">Carregue uma rodada em <b>Administrar</b>.</div></div>`; return; }
  if(!ws.includes(ui.week)) ui.week=ws[ws.length-1];
  const wk=getWeek(ui.week);

  let h=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:14px">
    <h2 style="margin:0">Semana ${ui.week}</h2>
    <div class="row">
      <button class="btn ghost sm" id="btnZap">Copiar bloco do zap</button>
      <label for="wsel">Ver</label>
      <select id="wsel">${ws.map(w=>`<option value="${w}" ${w===ui.week?'selected':''}>Semana ${w}</option>`).join('')}</select>
    </div></div>`;

  const missing = DB.players.filter(p=>Object.keys(wk.picks[p]||{}).length===0);
  if(missing.length) h+=`<div class="note">Sem palpites nesta rodada: ${missing.join(', ')}.</div>`;

  h+='<div class="games">';
  wk.games.forEach(g=>{
    h+=`<div class="game${g.flag?' intl':''}">${g.flag?`<span class="flag" title="${g.city}">${FLAGS[g.flag]||'🌎'} ${g.city}</span>`:''}<div class="gmatch">
      <button class="tm ${g.winner===g.away?'win':''}" style="color:${TC(g.away)}" data-win="${ui.week}|${g.id}|${g.away}">${T(g.away)}</button>
      <span class="at">em</span>
      <button class="tm ${g.winner===g.home?'win':''}" style="color:${TC(g.home)}" data-win="${ui.week}|${g.id}|${g.home}">${T(g.home)}</button>
      ${g.winner?`<button class="btn ghost sm" data-win="${ui.week}|${g.id}|">Limpar</button>`:''}
    </div><div class="picks">`;
    DB.players.forEach(p=>{
      const v=(wk.picks[p]||{})[g.id];
      let cls='';
      if(v&&g.winner&&g.winner!=='EMPATE') cls=v===g.winner?'hit':'miss';
      h+=`<span class="pick ${cls}"><b>${p}</b> <i${v?` style="color:${TC(v)};opacity:1"`:''}>${v?T(v):'—'}</i></span>`;
    });
    h+='</div></div>';
  });
  h+='</div><p class="sub" style="margin-top:12px">Clique no time para marcar quem venceu. Os resultados também chegam sozinhos quando você recarrega a rodada em Administrar.</p></div>';
  el.innerHTML=h;

  $('#wsel').onchange=e=>{ui.week=+e.target.value;render();};
  $('#btnZap').onclick=()=>{
    const txt = 'SEMANA '+ui.week+'\n\n' +
      wk.games.map(g=>`${T(g.away)} x ${T(g.home)}:${g.flag?' '+(FLAGS[g.flag]||'')  :''}`).join('\n');
    navigator.clipboard.writeText(txt).then(()=>{
      const b=$('#btnZap'); const old=b.textContent;
      b.textContent='Copiado'; setTimeout(()=>b.textContent=old,1600);
    }).catch(()=>{
      const ta=document.createElement('textarea');
      ta.value=txt;document.body.appendChild(ta);ta.select();
      document.execCommand('copy');ta.remove();
      const b=$('#btnZap');b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar bloco do zap',1600);
    });
  };
  el.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{
    const [w,id,team]=b.dataset.win.split('|');
    const g=getWeek(+w).games.find(x=>x.id===id);
    g.winner = team ? (g.winner===team?null:team) : null;
    render();
  });
}

/* ============================================================
   RENDER — ESTATÍSTICAS
   ============================================================ */
function renderStats(){
  const el=$('#p-stats');
  const ws=weekList().filter(w=>decided(w).length>0);
  if(!ws.length){ el.innerHTML=`<div class="card"><div class="empty">As estatísticas aparecem assim que a primeira rodada tiver resultados.</div></div>`; return; }

  const P=DB.players;
  const acc={},contra={},contraHit={},nemesis={},home={},homeHit={},away={},awayHit={},favor={},h2h={};
  P.forEach(p=>{acc[p]=[];contra[p]=0;contraHit[p]=0;nemesis[p]={};home[p]=0;homeHit[p]=0;away[p]=0;awayHit[p]=0;favor[p]={};h2h[p]={};P.forEach(q=>h2h[p][q]=0);});
  let groupHit=0,groupTot=0;
  const weekly={}; P.forEach(p=>weekly[p]=[]);

  ws.forEach(w=>{
    const wk=getWeek(w);
    P.forEach(p=>{ const s=weekScore(w,p); weekly[p].push(s.hit); });
    decided(w).forEach(g=>{
      const con=consensus(wk,g);
      if(con&&con.team){ groupTot++; if(con.team===g.winner) groupHit++; }
      P.forEach(p=>{
        const v=(wk.picks[p]||{})[g.id]; if(!v) return;
        const ok=v===g.winner;
        favor[p][v]=(favor[p][v]||0)+1;
        if(v===g.home){home[p]++;if(ok)homeHit[p]++;}else{away[p]++;if(ok)awayHit[p]++;}
        if(!ok){ const l=v; nemesis[p][l]=(nemesis[p][l]||0)+1; }
        if(con&&con.team&&v!==con.team){ contra[p]++; if(ok) contraHit[p]++; }
        P.forEach(q=>{
          if(q===p) return;
          const vq=(wk.picks[q]||{})[g.id]; if(!vq||vq===v) return;
          if(ok) h2h[p][q]++;
        });
      });
    });
  });
  P.forEach(p=>{let s=0;weekly[p].forEach(x=>{s+=x;acc[p].push(s);});});

  const tot=totals();
  const bar=(rows,cls,fmt)=>{
    const mx=Math.max(...rows.map(r=>r.v),1);
    return '<div class="bars">'+rows.map(r=>`<div class="bar"><span>${r.k}</span>
      <div class="track"><div class="fill ${cls||''}" style="width:${Math.round(r.v/mx*100)}%${r.col?`;background:${r.col}`:''}"></div></div>
      <span class="v">${fmt?fmt(r):r.v}</span></div>`).join('')+'</div>';
  };
  const topKey=o=>{const k=Object.keys(o);if(!k.length)return null;k.sort((a,b)=>o[b]-o[a]);return k[0];};

  let h='';

  /* 1 — evolução acumulada */
  const W=720,H=250,pad=30;
  const mxAcc=Math.max(1,...P.map(p=>acc[p][acc[p].length-1]||0));
  const PCOL={Erick:'#E12D2D',Lagoa:'#F2B824',Raphinha:'#A3E635',
              Lolo:'#A855F7',Jao:'#F5F0E4',Guir:'#22D3EE'};
  const fbc=['#E8B33A','#E4572E','#4FB477','#4B92DB','#C084FC','#F472B6'];
  const cols=P.map((pl,i)=>PCOL[pl]||fbc[i%fbc.length]);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Acertos acumulados por semana">`;
  for(let i=0;i<=4;i++){const y=pad+(H-pad*2)*i/4;svg+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="rgba(238,241,247,.1)"/>
    <text x="4" y="${y+4}" fill="#7D8CA8" font-size="10">${Math.round(mxAcc*(1-i/4))}</text>`;}
  P.forEach((p,i)=>{
    const pts=acc[p].map((v,j)=>{
      const x=pad+(W-pad*2)*(ws.length>1?j/(ws.length-1):.5);
      const y=pad+(H-pad*2)*(1-v/mxAcc);
      return `${x},${y}`;
    }).join(' ');
    svg+=`<polyline points="${pts}" fill="none" stroke="${cols[i]}" stroke-width="2.2" stroke-linejoin="round"/>`;
  });
  ws.forEach((w,j)=>{const x=pad+(W-pad*2)*(ws.length>1?j/(ws.length-1):.5);
    svg+=`<text x="${x}" y="${H-8}" fill="#7D8CA8" font-size="10" text-anchor="middle">${w}</text>`;});
  svg+='</svg>';
  h+=`<div class="card"><h3>Corrida da temporada</h3>
    <p class="sub">Acertos acumulados rodada a rodada.</p>${svg}
    <div class="legend">${P.map((p,i)=>`<span><i style="background:${cols[i]}"></i>${p}</span>`).join('')}</div></div>`;

  h+='<div class="grid">';

  /* 2 — jogo mais dividido da última rodada */
  const lastW=ws[ws.length-1], lwk=getWeek(lastW);
  let split=null;
  decided(lastW).forEach(g=>{
    const con=consensus(lwk,g); if(!con) return;
    const vals=Object.values(con.split); if(vals.length<2) return;
    const gap=Math.max(...vals)-Math.min(...vals);
    if(!split||gap<split.gap) split={g,gap,con};
  });
  h+=`<div class="stat"><h4>Jogo mais dividido</h4>
    <p class="why">Onde o grupo mais rachou na Semana ${lastW}.</p>`;
  if(split){
    h+=`<div style="font-family:'Barlow Condensed';font-weight:600;font-size:19px;margin-bottom:8px">
      ${TN(split.g.away)} <span style="color:var(--slate);font-size:14px">em</span> ${TN(split.g.home)}</div>`;
    Object.keys(split.con.split).forEach(t=>{
      const who=P.filter(p=>(lwk.picks[p]||{})[split.g.id]===t);
      const won=t===split.g.winner;
      h+=`<div class="kv"><span>${TN(t)} ${won?'✓':''}</span><span>${who.join(', ')}</span></div>`;
    });
  }else h+='<p class="why">Consenso total nesta rodada.</p>';
  h+='</div>';

  /* 3 — contrarianismo */
  h+=`<div class="stat"><h4>Contra a maré</h4>
    <p class="why">Quantas vezes votou contra a maioria — e o aproveitamento quando fez isso.</p>`+
    bar(P.map(p=>({k:p,v:contra[p],hit:contraHit[p]})),'',r=>`${r.v} · ${r.v?Math.round(r.hit/r.v*100):0}%`)+'</div>';

  /* 4 — nêmesis */
  h+=`<div class="stat"><h4>O time que te trai</h4>
    <p class="why">Em quem cada um mais apostou e se deu mal.</p>`;
  P.forEach(p=>{const k=topKey(nemesis[p]);
    h+=`<div class="kv"><span>${p}</span><span>${k?`${TN(k)} · ${nemesis[p][k]} erros`:'—'}</span></div>`;});
  h+='</div>';

  /* 5 — consenso do grupo */
  const gp=groupTot?Math.round(groupHit/groupTot*100):0;
  h+=`<div class="stat"><h4>Você contra o grupo</h4>
    <p class="why">Se a maioria fosse uma pessoa só, acertaria ${gp}%. Quem está abaixo perde para o próprio grupo.</p>`+
    bar(P.map(p=>({k:p,v:tot[p].played?Math.round(tot[p].hit/tot[p].played*100):0})),'ok',r=>r.v+'%')+
    `<div class="kv" style="margin-top:10px"><span>Consenso do grupo</span><span>${groupHit}/${groupTot} · ${gp}%</span></div></div>`;

  /* 6 — streak */
  h+=`<div class="stat"><h4>Fase</h4>
    <p class="why">Semanas seguidas acima ou abaixo da própria média.</p>`;
  P.forEach(p=>{
    const arr=weekly[p],avg=arr.reduce((a,b)=>a+b,0)/arr.length;
    let s=0,dir=0;
    for(let i=arr.length-1;i>=0;i--){
      const d=arr[i]>avg?1:arr[i]<avg?-1:0;
      if(d===0) break;
      if(dir===0) dir=d; else if(d!==dir) break;
      s++;
    }
    h+=`<div class="kv"><span>${p}</span><span>${s?`${s} semana${s>1?'s':''} ${dir>0?'em alta':'em baixa'}`:'na média'}</span></div>`;
  });
  h+='</div>';

  /* 7 — viés casa/fora */
  h+=`<div class="stat"><h4>Casa ou estrada</h4>
    <p class="why">Quanto cada um confia no mandante, e se isso paga.</p>`;
  P.forEach(p=>{
    const tt=home[p]+away[p];
    const share=tt?Math.round(home[p]/tt*100):0;
    const hr=home[p]?Math.round(homeHit[p]/home[p]*100):0;
    const ar=away[p]?Math.round(awayHit[p]/away[p]*100):0;
    h+=`<div class="kv"><span>${p}</span><span>${share}% mandante · casa ${hr}% / fora ${ar}%</span></div>`;
  });
  h+='</div>';

  /* 8 — fera do underdog */
  h+=`<div class="stat"><h4>Olho para o azarão</h4>
    <p class="why">Acertos em jogos onde apostou contra o grupo. É a estatística de quem enxerga o que ninguém vê.</p>`+
    bar(P.map(p=>({k:p,v:contraHit[p]})),'g')+'</div>';

  /* 9 — time favorito revelado */
  h+=`<div class="stat"><h4>Torcida revelada</h4>
    <p class="why">O time em que cada um mais votou na temporada.</p>`;
  P.forEach(p=>{const k=topKey(favor[p]);
    h+=`<div class="kv"><span>${p}</span><span>${k?`${TN(k)} · ${favor[p][k]}x`:'—'}</span></div>`;});
  h+='</div>';

  /* 10 — time favorito da semana */
  const favW={};
  DB.players.forEach(p=>{const pk=lwk.picks[p]||{};Object.values(pk).forEach(v=>favW[v]=(favW[v]||0)+1);});
  const fw=Object.keys(favW).sort((a,b)=>favW[b]-favW[a]).slice(0,5);
  h+=`<div class="stat"><h4>Queridinhos da Semana ${lastW}</h4>
    <p class="why">Os times em que o grupo mais depositou fé nesta rodada.</p>`+
    bar(fw.map(t=>({k:TN(t),v:favW[t],col:TC(t)})),'')+'</div>';

  h+='</div>';

  /* 11 — H2H */
  h+=`<div class="card"><h3>Cabeça a cabeça</h3>
    <p class="sub">Nos jogos em que discordaram, quantas vezes a linha venceu a coluna.</p>
    <div style="overflow-x:auto"><table class="h2h"><tr><th></th>${P.map(p=>`<th>${p.slice(0,4)}</th>`).join('')}</tr>`;
  P.forEach(p=>{
    h+=`<tr><th style="text-align:left">${p}</th>`;
    P.forEach(q=>{
      if(p===q){h+='<td class="self">·</td>';return;}
      const a=h2h[p][q],b=h2h[q][p];
      h+=`<td class="${a>b?'w':a<b?'l':''}">${a}-${b}</td>`;
    });
    h+='</tr>';
  });
  h+='</table></div></div>';

  el.innerHTML=h;
}

    h+=`<div class="card paper">
      <h2>Lançar palpites</h2>
      <p class="sub">Semana ${cur} · ${wk.games.length} jogos. Cole a mensagem de um participante por vez.</p>
      <div class="row" style="margin-bottom:10px">

        <select id="who">${DB.players.map(p=>{
          const n=Object.keys(wk.picks[p]||{}).length;
          return `<option value="${p}">${p}${n?` (${n} lançados)`:''}</option>`;}).join('')}</select>
      </div>
      <textarea id="pickTxt" placeholder="Buccs x Falcons: *Buccs*&#10;Bears x Browns: *Bears*&#10;Bengals x Ravens: *Bengals*"></textarea>
      <div class="row end" style="margin-top:9px"><button class="btn" id="btnParse">Conferir palpites</button></div>
      <div id="revBox"></div>
    </div>`;
  }

  h+=`<div class="card paper">
    <h2>Participantes</h2>
    <p class="sub">${DB.players.join(', ')}</p>
    <div class="row">
      <input type="text" id="newP" placeholder="Nome do participante">
      <button class="btn ghost" id="btnAddP">Adicionar</button>
    </div>
  </div>

  <div class="card paper">
    <h2>Backup</h2>
    <p class="sub">Baixe o arquivo depois de cada rodada. Ele guarda tudo: jogos, palpites e resultados.</p>
    <div class="row">
      <button class="btn gold" id="btnExp">Baixar backup</button>
      <button class="btn ghost" id="btnImpBtn">Restaurar backup</button>
      <input type="file" id="btnImp" accept="application/json" style="display:none">
      <button class="btn ghost" id="btnPO">${DB.playoffsUnlocked?'Travar playoffs':'Liberar playoffs'}</button>
    </div>
    <p class="sub" style="margin:12px 0 0">Fechou a aba sem baixar? Os lançamentos daquela sessão se perdem — o backup é o que segura a temporada.</p>
  </div>`;

  el.innerHTML=h;

  $('#wnum').onchange=e=>{ui.week=+e.target.value;};
  $('#btnLoad').onclick=async()=>{ ui.week=+$('#wnum').value; await loadWeek(ui.week); };
  $('#btnManual').onclick=()=>{const b=$('#manualBox');b.style.display=b.style.display==='none'?'block':'none';};
  $('#btnSched').onclick=()=>{
    const w=+$('#wnum').value;
    const {games,bad}=parseSchedule($('#schedTxt').value);
    if(!games.length){ $('#loadMsg').textContent='Nenhum confronto reconhecido. Use o formato "Bears x Panthers".'; return; }
    mergeGames(w,games,true);
    ui.week=w;
    $('#loadMsg').textContent=`Semana ${w} salva com ${games.length} jogos.`+(bad.length?` ${bad.length} linha(s) ignorada(s).`:'');

  };
  $('#btnAddP').onclick=()=>{
    const v=$('#newP').value.trim();

  $('#btnPO').onclick=()=>{DB.playoffsUnlocked=!DB.playoffsUnlocked;render();};

    a.download=`bolao-nfl-${DB.season}.json`;
    a.click(); URL.revokeObjectURL(a.href);

  $('#btnImpBtn').onclick=()=>$('#btnImp').click();
  $('#btnImp').onchange=e=>{

    r.onload=()=>{ try{ DB=JSON.parse(r.result); render(); }catch(err){ alert('Arquivo não reconhecido.'); } };
    r.readAsText(f);
  };

  const bp=$('#btnParse');
  if(bp) bp.onclick=()=>{
    const player=$('#who').value;
    const {rows,unmatched}=parsePicks($('#pickTxt').value,wk.games);
    ui.parsed=rows; ui.parsedPlayer=player;
    renderReview(wk,rows,unmatched,player,cur);
  };
}

function renderReview(wk,rows,unmatched,player,w){
  const box=$('#revBox');
  const got=new Set(rows.map(r=>r.gameId));
  const missing=wk.games.filter(g=>!got.has(g.id));
  let h='<h3 style="margin-top:18px">Conferir antes de salvar</h3>';
  if(unmatched.length) h+=`<div class="warn">Não entendi ${unmatched.length} linha(s): ${unmatched.slice(0,3).map(s=>`"${s}"`).join(', ')}${unmatched.length>3?'…':''}</div>`;
  if(missing.length) h+=`<div class="warn">Faltam ${missing.length} jogo(s). Escolha abaixo ou deixe em branco.</div>`;

  h+='<div class="rev">';
  wk.games.forEach(g=>{
    const r=rows.find(x=>x.gameId===g.id);
    const val=r?r.pick:null;
    h+=`<div class="revrow ${val?'':'bad'}">
      <span class="m">${T(g.away)} <span style="color:#7D8CA8;font-weight:400">em</span> ${T(g.home)}</span>
      <select data-g="${g.id}">
        <option value="">— sem palpite —</option>
        <option value="${g.away}" ${val===g.away?'selected':''}>${T(g.away)}</option>
        <option value="${g.home}" ${val===g.home?'selected':''}>${T(g.home)}</option>
      </select></div>`;
  });
  h+=`</div><div class="row end">
    <button class="btn ghost sm" id="revCancel">Descartar</button>
    <button class="btn" id="revSave">Salvar palpites de ${player}</button></div>`;
  box.innerHTML=h;

  $('#revCancel').onclick=()=>{box.innerHTML='';};
  $('#revSave').onclick=()=>{
    const picks={};
    box.querySelectorAll('select[data-g]').forEach(s=>{ if(s.value) picks[s.dataset.g]=s.value; });
    wk.picks[player]=picks;
    render();
    ui.panel='week';
    setPanel('week');
  };
}

}

  document.querySelectorAll('.panel').forEach(s=>s.classList.toggle('on',s.id==='p-'+p));
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(!t.disabled)setPanel(t.dataset.p);});

// so preenche semanas que ainda nao tem jogos — nunca apaga resultados ja salvos
for(const w in FALLBACK){
  const wk = ensureWeek(+w);
  if(!wk.games || !wk.games.length) wk.games = fromFallback(+w);
}
// abre na ultima semana que ja tem resultado
const _done = weekList().filter(w=>decided(w).length>0);
ui.week = _done.length ? _done[_done.length-1] : 1;
render();
(function(){
  const el=document.querySelector('#stamp'); if(!el) return;
  const n=_done.reduce((a,w)=>a+decided(w).length,0);
  el.textContent = _done.length
    ? `Semanas ${_done[0]}–${_done[_done.length-1]} · ${n} resultados`
    : 'sem resultados carregados';
})();
</script>
</body>
